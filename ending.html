<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chúc em bé ngày mai nhẹ lòng hơn</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <style>


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            background: #0B1020;

            color: #F4F1EA;

            font-family:
                "Inter",
                sans-serif;

            overflow: hidden;

            opacity: 0;

            animation:
                pageEnter
                2s
                ease
                forwards;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 38%,
                    rgba(
                        167,
                        139,
                        250,
                        0.10
                    ),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 20% 80%,
                    rgba(
                        125,
                        211,
                        252,
                        0.05
                    ),
                    transparent 30%
                ),

                #0B1020;

        }


        /* =====================================================
           STARS
        ===================================================== */

        .stars {

            position: absolute;

            inset: 0;

        }


        .star {

            position: absolute;

            width: 2px;

            height: 2px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            animation:

                starAppear
                2s
                ease
                forwards,

                starTwinkle
                5s
                ease-in-out
                infinite
                alternate;

        }


        .star:nth-child(1) {

            top: 10%;

            left: 12%;

            animation-delay:
                .5s,
                2s;

        }


        .star:nth-child(2) {

            top: 18%;

            left: 80%;

            animation-delay:
                .8s,
                3s;

        }


        .star:nth-child(3) {

            top: 28%;

            left: 30%;

            animation-delay:
                1s,
                1s;

        }


        .star:nth-child(4) {

            top: 38%;

            left: 90%;

            animation-delay:
                1.2s,
                2.5s;

        }


        .star:nth-child(5) {

            top: 55%;

            left: 15%;

            animation-delay:
                .7s,
                1.5s;

        }


        .star:nth-child(6) {

            top: 68%;

            left: 75%;

            animation-delay:
                1.5s,
                3.5s;

        }


        .star:nth-child(7) {

            top: 82%;

            left: 35%;

            animation-delay:
                1.8s,
                2s;

        }


        .star:nth-child(8) {

            top: 14%;

            left: 55%;

            animation-delay:
                1.3s,
                1s;

        }


        .star:nth-child(9) {

            top: 48%;

            left: 63%;

            animation-delay:
                .9s,
                3s;

        }


        .star:nth-child(10) {

            top: 88%;

            left: 85%;

            animation-delay:
                1.6s,
                2.5s;

        }


        .star:nth-child(11) {

            top: 73%;

            left: 55%;

            animation-delay:
                1.1s,
                1.8s;

        }


        .star:nth-child(12) {

            top: 32%;

            left: 72%;

            animation-delay:
                .6s,
                2.8s;

        }


        /* =====================================================
           MOON
        ===================================================== */

        .moon {

            position: absolute;

            top: 12%;

            left: 50%;

            width: 88px;

            height: 88px;

            border-radius: 50%;

            background:
                #F4F1EA;

            transform:
                translateX(-50%)
                translateY(-30px);

            opacity: 0;

            box-shadow:

                0 0 30px
                rgba(
                    244,
                    241,
                    234,
                    .15
                ),

                0 0 80px
                rgba(
                    167,
                    139,
                    250,
                    .08
                );

            animation:

                moonAppear
                2.2s
                ease
                .8s
                forwards,

                moonFloat
                8s
                ease-in-out
                3s
                infinite;

        }


        /* Moon shadow */

        .moon::after {

            content: "";

            position: absolute;

            width: 88px;

            height: 88px;

            top: -9px;

            left: 20px;

            border-radius: 50%;

            background:
                #0B1020;

        }


        /* =====================================================
           SOFT GLOW
        ===================================================== */

        .moon-glow {

            position: absolute;

            top: 12%;

            left: 50%;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            transform:
                translate(-50%, -20%);

            background:
                rgba(
                    167,
                    139,
                    250,
                    .025
                );

            filter:
                blur(35px);

            opacity: 0;

            animation:

                glowAppear
                3s
                ease
                1.5s
                forwards;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: 100%;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding:
                120px 24px;

        }


        .content {

            width: 100%;

            max-width: 720px;

        }


        /* =====================================================
           FIRST MESSAGE
        ===================================================== */

        .message-one {

            opacity: 0;

            transform:
                translateY(25px);

            animation:

                textAppear
                1.5s
                ease
                2.5s
                forwards;

        }


        .message-one p {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(
                    27px,
                    5vw,
                    40px
                );

            line-height: 1.6;

            font-weight: 400;

        }


        .message-one .soft {

            color:
                #AEB6CC;

            font-size:
                clamp(
                    16px,
                    3vw,
                    19px
                );

            font-family:
                "Inter",
                sans-serif;

            font-weight: 300;

            margin-top: 24px;

            line-height: 1.9;

        }


        /* =====================================================
           FINAL MESSAGE
        ===================================================== */

        .final-message {

            margin-top: 70px;

            opacity: 0;

            transform:
                translateY(25px);

            animation:

                textAppear
                1.5s
                ease
                4.8s
                forwards;

        }


        .final-message p {

            color:
                #AEB6CC;

            font-size:
                15px;

            line-height: 2.1;

            font-weight: 300;

        }


        .final-message span {

            display: block;

            margin-top: 13px;

        }


        /* =====================================================
           MAIN FINAL LINE
        ===================================================== */

        .goodnight {

            margin-top: 45px;

            opacity: 0;

            transform:
                translateY(20px)
                scale(.98);

            animation:

                finalAppear
                1.8s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                )
                6.3s
                forwards;

        }


        .goodnight h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(
                    28px,
                    6vw,
                    48px
                );

            font-weight: 400;

            line-height: 1.5;

            color:
                #F4F1EA;

        }


        .heart {

            display: inline-block;

            color:
                #F0ABFC;

            margin-left: 5px;

            animation:

                heartbeat
                2.5s
                ease-in-out
                infinite;

        }


        /* =====================================================
           SIGNATURE
        ===================================================== */

        .signature {

            margin-top: 28px;

            color:
                #A78BFA;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                16px;

            letter-spacing:
                .5px;

            opacity: 0;

            animation:

                signatureAppear
                1.3s
                ease
                7.5s
                forwards;

        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .restart {

            margin-top: 65px;

            opacity: 0;

            animation:

                buttonAppear
                1.2s
                ease
                8.2s
                forwards;

        }


        .restart-button {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding:
                13px 25px;

            border:
                1px solid
                rgba(
                    167,
                    139,
                    250,
                    .25
                );

            border-radius: 50px;

            background:
                rgba(
                    167,
                    139,
                    250,
                    .025
                );

            color:
                #AEB6CC;

            text-decoration: none;

            font-size:
                12px;

            letter-spacing:
                1px;

            transition:
                all .4s ease;

        }


        .restart-button:hover {

            color:
                #F4F1EA;

            transform:
                translateY(-3px);

            background:
                rgba(
                    167,
                    139,
                    250,
                    .08
                );

            border-color:
                rgba(
                    167,
                    139,
                    250,
                    .7
                );

            box-shadow:
                0 0 25px
                rgba(
                    167,
                    139,
                    250,
                    .10
                );

        }


        /* =====================================================
           PAGE TRANSITION
        ===================================================== */

        .page-transition {

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                #0B1020;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .9s ease;

        }


        body.leaving
        .page-transition {

            opacity: 1;

        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes pageEnter {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }

        }


        @keyframes starAppear {

            from {

                opacity: 0;

            }

            to {

                opacity: .55;

            }

        }


        @keyframes starTwinkle {

            from {

                transform:
                    scale(.7);

                opacity:
                    .2;

            }

            to {

                transform:
                    scale(1.4);

                opacity:
                    .8;

            }

        }


        @keyframes moonAppear {

            from {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(-30px)
                    scale(.85);

            }

            to {

                opacity: .95;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes moonFloat {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    translateY(0);

            }

            50% {

                transform:
                    translateX(-50%)
                    translateY(-9px);

            }

        }


        @keyframes glowAppear {

            from {

                opacity: 0;

                transform:
                    translate(-50%, -20%)
                    scale(.7);

            }

            to {

                opacity: 1;

                transform:
                    translate(-50%, -20%)
                    scale(1);

            }

        }


        @keyframes textAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes finalAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes signatureAppear {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: .8;

                transform:
                    translateY(0);

            }

        }


        @keyframes buttonAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.12);

            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .moon {

                width: 65px;

                height: 65px;

                top: 10%;

            }


            .moon::after {

                width: 65px;

                height: 65px;

                left: 15px;

                top: -7px;

            }


            main {

                padding:
                    110px 22px;

            }


            .message-one p {

                font-size:
                    28px;

            }


            .final-message {

                margin-top:
                    55px;

            }


            .goodnight {

                margin-top:
                    38px;

            }


            .goodnight h1 {

                font-size:
                    29px;

            }


            .restart {

                margin-top:
                    50px;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="background">


        <div class="moon-glow"></div>


        <div class="moon"></div>


        <div class="stars">

            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>

        </div>


    </div>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main>


        <div class="content">


            <!-- FIRST MESSAGE -->

            <section class="message-one">

                <p>

                    Vậy là hôm nay...

                    <br>

                    mình đã ở đây
                    một chút rồi.

                </p>


                <p class="soft">

                    Không cần phải giải quyết
                    tất cả mọi thứ ngay hôm nay.

                </p>

            </section>



            <!-- SECOND MESSAGE -->

            <section class="final-message">

                <p>

                    Uống một chút nước.

                    <span>
                        Ăn một chút gì đó.
                    </span>

                    <span>
                        Nghỉ ngơi một chút.
                    </span>

                    <span>
                        Và...
                    </span>

                </p>

            </section>



            <!-- FINAL LINE -->

            <section class="goodnight">

                <h1>

                    Hãy dịu dàng
                    với chính mình.

                    <span class="heart">
                        ♡
                    </span>

                </h1>


                <div class="signature">

                    Sam à, em bé đã cố gắng đủ nhiều rồi.

                </div>

            </section>



            <!-- RESTART -->

            <section class="restart">

                <a
                    href="index.html"
                    class="restart-button"
                    id="restartButton"
                >

                    ↻

                    Quay lại từ đầu

                </a>

            </section>


        </div>


    </main>


    <!-- PAGE TRANSITION -->

    <div class="page-transition"></div>



    <script>


        /* =====================================================
           PAGE TRANSITION
        ===================================================== */

        const restartButton =
            document.getElementById(
                "restartButton"
            );


        restartButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                document.body
                    .classList
                    .add("leaving");


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    900
                );

            }
        );


    </script>


</body>

</html>
