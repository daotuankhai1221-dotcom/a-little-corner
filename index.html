<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Baobei ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            opacity: 0;
            animation: pageFadeIn 1.5s ease forwards;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            position: relative;
            z-index: 2;

            text-align: center;
            padding: 30px;

            animation: contentFadeIn 2s ease forwards;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 25px;

            animation: heartbeat 1.8s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(35px, 7vw, 70px);
            font-weight: normal;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .subtitle {
            font-size: clamp(16px, 2.5vw, 20px);

            color: #ccc;

            letter-spacing: 2px;

            margin-bottom: 40px;
        }

        /* =========================
           ENTER BUTTON
        ========================= */

        .button {
            display: inline-block;

            padding: 14px 35px;

            border: 1px solid #fff;
            border-radius: 30px;

            color: #fff;
            background: transparent;

            text-decoration: none;

            font-size: 16px;
            letter-spacing: 2px;

            cursor: pointer;

            transition:
                background 0.4s ease,
                color 0.4s ease,
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .button:hover {
            background: #fff;
            color: #000;

            transform: scale(1.08);

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(255, 255, 255, 0.2);
        }

        .button:active {
            transform: scale(0.96);
        }

        /* =========================
           STARS
        ========================= */

        .stars {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 0;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: #fff;

            border-radius: 50%;

            opacity: 0.7;

            animation: twinkle 3s ease-in-out infinite alternate;
        }

        /* =========================
           PAGE TRANSITION
        ========================= */

        body.fade-out {
            animation: pageFadeOut 0.8s ease forwards;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes contentFadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes pageFadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .heart {
                font-size: 55px;
                margin-bottom: 20px;
            }

            h1 {
                letter-spacing: 2px;
            }

            .subtitle {
                line-height: 1.6;
                margin-bottom: 30px;
            }

            .button {
                padding: 13px 30px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND STARS
    ========================= -->

    <div class="stars">

        <span class="star" style="top:10%; left:15%;"></span>
        <span class="star" style="top:20%; left:80%;"></span>
        <span class="star" style="top:35%; left:30%;"></span>
        <span class="star" style="top:50%; left:70%;"></span>
        <span class="star" style="top:65%; left:15%;"></span>
        <span class="star" style="top:75%; left:85%;"></span>
        <span class="star" style="top:85%; left:40%;"></span>
        <span class="star" style="top:15%; left:55%;"></span>
        <span class="star" style="top:45%; left:90%;"></span>
        <span class="star" style="top:80%; left:65%;"></span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="container">

        <div class="heart">
            ♡
        </div>

        <h1>
            For My Baobei
        </h1>

        <div class="subtitle">
            A little place made just for you, Sam.
        </div>

        <a
            href="story.html"
            class="button"
            id="enterButton"
        >
            Enter
        </a>

    </main>


    <!-- =========================
         PAGE TRANSITION
    ========================= -->

    <script>

        const enterButton = document.getElementById("enterButton");

        enterButton.addEventListener("click", function(event) {

            event.preventDefault();

            document.body.classList.add("fade-out");

            setTimeout(function() {

                window.location.href = "story.html";

            }, 800);

        });

    </script>

</body>
</html>
