<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Baobei ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
            animation: fadeIn 2s ease;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 25px;

            animation: heartbeat 1.8s infinite;
        }

        h1 {
            font-size: clamp(35px, 7vw, 70px);
            font-weight: normal;
            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 20px;
            color: #ccc;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;

            padding: 14px 35px;

            border: 1px solid white;
            border-radius: 30px;

            color: white;
            text-decoration: none;

            font-size: 16px;
            letter-spacing: 2px;

            transition: all 0.4s ease;
        }

        .button:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;
            border-radius: 50%;

            opacity: 0.7;

            animation: twinkle 3s infinite alternate;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star" style="top:10%; left:15%;"></span>
        <span class="star" style="top:20%; left:80%;"></span>
        <span class="star" style="top:35%; left:30%;"></span>
        <span class="star" style="top:50%; left:70%;"></span>
        <span class="star" style="top:65%; left:15%;"></span>
        <span class="star" style="top:75%; left:85%;"></span>
        <span class="star" style="top:85%; left:40%;"></span>
        <span class="star" style="top:15%; left:55%;"></span>
        <span class="star" style="top:45%; left:90%;"></span>
        <span class="star" style="top:80%; left:65%;"></span>
    </div>

    <div class="container">

        <div class="heart">♡</div>

        <h1>For My Baobei</h1>

        <div class="subtitle">
            A little place made just for you, Sam.
        </div>

        <a href="#" class="button">
            Enter
        </a>

    </div>

</body>
</html>
